<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d">
  <title id="t">How Is It Just Me? works</title>
  <desc id="d">Every 15 minutes a timer on Google Apps Script reads 43 public status pages once and writes status.json and RSS feeds to GitHub Pages in one commit. Every visitor's browser reads only that cached copy.</desc>
  <style>
    .bg { fill: #0d1117; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .h { font: 700 15px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .t { font: 500 12.5px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .m { font: 500 11.5px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #8b949e; }
    .big { font: 800 22px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .chip { fill: #0d1117; stroke: #30363d; }
    .flow { fill: none; stroke: #30363d; stroke-width: 2; stroke-dasharray: 5 7; animation: flow 1.2s linear infinite; }
    .flow.blue { stroke: #1f6feb; } .flow.green { stroke: #238636; } .flow.purple { stroke: #8957e5; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .pulse { animation: pulse 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(2.6); opacity: 0; } }
    .ring1 { fill: #1f6feb22; stroke: #1f6feb; } .ring2 { fill: #8957e522; stroke: #8957e5; } .ring3 { fill: #23863633; stroke: #3fb950; }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
  </style>

  <rect class="bg" width="960" height="460" rx="18"/>
  <text class="big" x="32" y="46">How it works</text>
  <text class="m" x="32" y="68">No servers · no database · no trackers — free Google Apps Script timer + GitHub Pages</text>

  <!-- ============ 1. Public status pages ============ -->
  <rect class="card" x="28" y="92" width="196" height="318" rx="14"/>
  <text class="h" x="46" y="120">① Public status pages</text>
  <g class="t">
    <rect class="chip" x="46" y="136" width="160" height="30" rx="8"/><text x="60" y="156">AWS · Azure · GCP</text>
    <rect class="chip" x="46" y="174" width="160" height="30" rx="8"/><text x="60" y="194">Azure DevOps · GitHub</text>
    <rect class="chip" x="46" y="212" width="160" height="30" rx="8"/><text x="60" y="232">Teams · Zoom · Slack</text>
    <rect class="chip" x="46" y="250" width="160" height="30" rx="8"/><text x="60" y="270">Jira · Notion · Figma</text>
    <rect class="chip" x="46" y="288" width="160" height="30" rx="8"/><text x="60" y="308">Workday · Gusto · Lever</text>
    <rect class="chip" x="46" y="326" width="160" height="30" rx="8"/><text x="60" y="346">OpenAI · Claude · …</text>
  </g>
  <text class="m" x="46" y="384">43 services · 9 data formats</text>
  <text class="m" x="46" y="400">read-only, public data</text>

  <!-- ============ 2. GitHub Action (collector) ============ -->
  <rect class="card" x="276" y="92" width="250" height="230" rx="14"/>
  <text class="h" x="294" y="120">② Apps Script timer</text>
  <text class="m" x="294" y="138">every 15 min · one commit</text>
  <!-- onion -->
  <rect class="ring1" x="296" y="152" width="210" height="150" rx="16"/>
  <rect class="ring2" x="314" y="180" width="174" height="98" rx="12"/>
  <rect class="ring3" x="334" y="206" width="134" height="48" rx="10"/>
  <text class="m" x="308" y="170">adapters · infrastructure</text>
  <text class="m" x="326" y="198">application (use case)</text>
  <text class="t" x="352" y="235">domain rules</text>
  <circle cx="490" cy="168" r="5" fill="#3fb950"/><circle class="pulse" cx="490" cy="168" r="5" fill="#3fb950"/>

  <!-- ============ 3. Output ============ -->
  <rect class="card" x="276" y="346" width="250" height="64" rx="14"/>
  <path d="M296 362h18l8 8v24h-26z" fill="none" stroke="#8b949e" stroke-width="1.6"/>
  <text class="h" x="334" y="374">③ status.json</text>
  <text class="m" x="334" y="394">+ RSS feeds · history</text>

  <!-- ============ 4. GitHub Pages ============ -->
  <rect class="card" x="580" y="160" width="160" height="120" rx="14"/>
  <circle cx="660" cy="200" r="18" fill="none" stroke="#58a6ff" stroke-width="1.8"/>
  <path d="M642 200h36M660 182c-8 10-8 26 0 36M660 182c8 10 8 26 0 36" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <text class="h" x="660" y="242" text-anchor="middle">④ GitHub Pages</text>
  <text class="m" x="660" y="260" text-anchor="middle">static · CDN-cached · free</text>

  <!-- ============ 5. Visitor (phone) ============ -->
  <rect x="790" y="84" width="142" height="300" rx="22" fill="#010409" stroke="#30363d" stroke-width="2"/>
  <rect x="802" y="100" width="118" height="268" rx="12" fill="#f6f6f3"/>
  <text x="812" y="124" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#17181c">Is It Just Me?</text>
  <text x="812" y="146" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#17181c">Everything is</text>
  <text x="812" y="160" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="800" fill="#17181c">working.</text>
  <rect x="812" y="172" width="98" height="18" rx="6" fill="#fff" stroke="#d2d2cb"/>
  <text x="820" y="185" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="8.5" fill="#676c77">Teams, Zoom, AWS…</text>
  <g font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="9.5" fill="#17181c">
    <rect x="812" y="200" width="98" height="26" rx="6" fill="#fff" stroke="#e4e4de"/><text x="820" y="217">Zoom</text>
    <circle cx="898" cy="213" r="5" fill="#1e8a4a">
      <animate attributeName="fill" values="#1e8a4a;#1e8a4a;#c93a2e;#c93a2e;#1e8a4a" keyTimes="0;.45;.5;.85;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <rect x="812" y="232" width="98" height="26" rx="6" fill="#fff" stroke="#e4e4de"/><text x="820" y="249">Azure DevOps</text>
    <circle cx="898" cy="245" r="5" fill="#1e8a4a"/>
    <rect x="812" y="264" width="98" height="26" rx="6" fill="#fff" stroke="#e4e4de"/><text x="820" y="281">GitHub</text>
    <circle cx="898" cy="277" r="5" fill="#1e8a4a"/>
    <rect x="812" y="296" width="98" height="26" rx="6" fill="#fff" stroke="#e4e4de"/><text x="820" y="313">Teams</text>
    <circle cx="898" cy="309" r="5" fill="none" stroke="#6f7480" stroke-width="1.6"/>
  </g>
  <!-- notification toast that appears when Zoom goes down -->
  <g opacity="0">
    <rect x="808" y="330" width="106" height="28" rx="7" fill="#17181c"/>
    <text x="816" y="348" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="9" font-weight="700" fill="#fff">🔔 Zoom: Down</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.49;.52;.8;.84;1" dur="8s" repeatCount="indefinite"/>
  </g>
  <text class="h" x="861" y="410" text-anchor="middle">⑤ You</text>
  <text class="m" x="861" y="428" text-anchor="middle">reads the cached copy</text>

  <!-- ============ Connectors + moving packets ============ -->
  <path id="p1" class="flow blue" d="M224 250 C 250 250, 252 230, 296 228"/>
  <path id="p2" class="flow purple" d="M401 322 L 401 346"/>
  <path id="p3" class="flow green" d="M526 378 C 600 378, 620 330, 640 280"/>
  <path id="p4" class="flow green" d="M740 220 C 760 220, 770 220, 790 220"/>

  <circle r="5" fill="#58a6ff"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle r="5" fill="#58a6ff"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle r="5" fill="#bc8cff"><animateMotion dur="1.2s" begin=".6s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  <circle r="5" fill="#3fb950"><animateMotion dur="2.4s" begin=".3s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  <circle r="5" fill="#3fb950"><animateMotion dur="1.6s" begin=".9s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>

  <!-- privacy boundary -->
  <rect x="566" y="72" width="378" height="368" rx="16" fill="none" stroke="#3fb95055" stroke-width="1.5" stroke-dasharray="3 6"/>
  <text class="m" x="580" y="92" style="fill:#3fb950">🔒 your browser talks only to GitHub Pages</text>
</svg>
