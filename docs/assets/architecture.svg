<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">How Is It Just Me? works</title>
  <desc id="d">GitHub Pages serves the static website and the list of services. After the visitor allows live checks, their own browser asks 36 companies' public status pages directly, on every visit and every 5 minutes, and shows one plain answer. There is no backend.</desc>
  <style>
    .bg { fill: #0d1117; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .h { font: 700 15px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .t { font: 500 12.5px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .m { font: 500 11.5px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #8b949e; }
    .big { font: 800 22px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .chip { fill: #0d1117; stroke: #30363d; }
    .flow { fill: none; stroke-width: 2; stroke-dasharray: 5 7; animation: flow 1.2s linear infinite; }
    .blue { stroke: #1f6feb; } .green { stroke: #238636; } .purple { stroke: #8957e5; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .pulse { animation: pulse 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(2.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
  </style>

  <rect class="bg" width="960" height="440" rx="18"/>
  <text class="big" x="32" y="46">How it works</text>
  <text class="m" x="32" y="68">No backend · no database · no tokens — a static site, and your browser does the checking (only if you allow it)</text>

  <!-- ① GitHub Pages -->
  <rect class="card" x="28" y="120" width="210" height="190" rx="14"/>
  <text class="h" x="46" y="148">① GitHub Pages</text>
  <text class="m" x="46" y="166">static files only · free</text>
  <g class="t">
    <rect class="chip" x="46" y="180" width="174" height="28" rx="8"/><text x="58" y="199">index.html · CSS · JS</text>
    <rect class="chip" x="46" y="216" width="174" height="28" rx="8"/><text x="58" y="235">catalog.json (43 tools)</text>
    <rect class="chip" x="46" y="252" width="174" height="28" rx="8"/><text x="58" y="271">icons · fonts</text>
  </g>
  <text class="m" x="46" y="300">sent once, when you open the page</text>

  <!-- ② Your browser (phone) -->
  <rect x="404" y="88" width="152" height="300" rx="22" fill="#010409" stroke="#30363d" stroke-width="2"/>
  <rect x="416" y="104" width="128" height="268" rx="12" fill="#f6f6f3"/>
  <g font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#17181c">
    <text x="426" y="128" font-size="10.5" font-weight="800">Is It Just Me?</text>
    <text x="426" y="150" font-size="11" font-weight="800">Everything is</text>
    <text x="426" y="164" font-size="11" font-weight="800">working.</text>
    <text x="426" y="180" font-size="8" fill="#676c77">Checked live just now</text>
    <rect x="426" y="190" width="108" height="26" rx="6" fill="#fff" stroke="#e4e4de"/><text x="434" y="207" font-size="9.5">Zoom</text>
    <circle cx="522" cy="203" r="5" fill="#1e8a4a">
      <animate attributeName="fill" values="#1e8a4a;#1e8a4a;#c93a2e;#c93a2e;#1e8a4a" keyTimes="0;.45;.5;.85;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <rect x="426" y="222" width="108" height="26" rx="6" fill="#fff" stroke="#e4e4de"/><text x="434" y="239" font-size="9.5">Azure DevOps</text>
    <circle cx="522" cy="235" r="5" fill="#1e8a4a"/>
    <rect x="426" y="254" width="108" height="26" rx="6" fill="#fff" stroke="#e4e4de"/><text x="434" y="271" font-size="9.5">GitHub</text>
    <circle cx="522" cy="267" r="5" fill="#1e8a4a"/>
    <rect x="426" y="286" width="108" height="26" rx="6" fill="#fff" stroke="#e4e4de"/><text x="434" y="303" font-size="9.5">AWS</text>
    <circle cx="522" cy="299" r="5" fill="none" stroke="#6f7480" stroke-width="1.6"/>
  </g>
  <g opacity="0">
    <rect x="422" y="330" width="116" height="28" rx="7" fill="#17181c"/>
    <text x="430" y="348" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="9" font-weight="700" fill="#fff">🔔 Zoom: Down</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.49;.52;.8;.84;1" dur="8s" repeatCount="indefinite"/>
  </g>
  <text class="h" x="480" y="412" text-anchor="middle">② Your browser runs the script</text>
  <text class="m" x="480" y="430" text-anchor="middle">on every visit + every 5 min (tab visible)</text>
  <circle cx="548" cy="96" r="5" fill="#3fb950"/><circle class="pulse" cx="548" cy="96" r="5" fill="#3fb950"/>

  <!-- ③ Public status APIs -->
  <rect class="card" x="722" y="92" width="210" height="270" rx="14"/>
  <text class="h" x="740" y="120">③ Public status APIs</text>
  <g class="t">
    <rect class="chip" x="740" y="136" width="174" height="28" rx="8"/><text x="752" y="155">GitHub · Azure DevOps</text>
    <rect class="chip" x="740" y="172" width="174" height="28" rx="8"/><text x="752" y="191">Zoom · Slack · Google</text>
    <rect class="chip" x="740" y="208" width="174" height="28" rx="8"/><text x="752" y="227">Jira · Notion · Figma</text>
    <rect class="chip" x="740" y="244" width="174" height="28" rx="8"/><text x="752" y="263">OpenAI · Claude · …</text>
  </g>
  <text class="m" x="740" y="296">36 companies · read-only, public</text>
  <text class="m" x="740" y="314">exact allow-list in the page's</text>
  <text class="m" x="740" y="330">security policy</text>

  <!-- consent gate -->
  <rect x="598" y="150" width="88" height="44" rx="10" fill="#0d1117" stroke="#3fb950" stroke-dasharray="3 4"/>
  <text x="642" y="168" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="700" fill="#3fb950">🔒 only if</text>
  <text x="642" y="184" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="700" fill="#3fb950">you allow</text>

  <!-- flows -->
  <path id="p1" class="flow blue" d="M238 215 C 300 215, 340 215, 404 215"/>
  <path id="p2" class="flow purple" d="M556 225 C 600 225, 640 225, 722 225"/>
  <path id="p3" class="flow green" d="M722 255 C 640 255, 600 255, 556 255"/>
  <circle r="5" fill="#58a6ff"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle r="5" fill="#bc8cff"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  <circle r="5" fill="#bc8cff"><animateMotion dur="1.8s" begin=".9s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  <circle r="5" fill="#3fb950"><animateMotion dur="1.8s" begin=".45s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  <circle r="5" fill="#3fb950"><animateMotion dur="1.8s" begin="1.35s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  <text class="m" x="640" y="246" text-anchor="middle">ask</text>
  <text class="m" x="640" y="276" text-anchor="middle">status</text>
</svg>
