name: Test, collect status and deploy

on:
  schedule:
    - cron: '*/10 * * * *'   # GitHub may delay this by a few minutes
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'collector/**', 'config/**', 'tests/**', '.github/workflows/status.yml']

# Least privilege: nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to commit data/history.json when a status changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # A broken change never reaches the live site.
      - name: Run tests
        run: node --test "tests/**/*.test.js"

      - name: Collect public status feeds
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node collector/main.js

      - name: Save history only when something changed
        run: |
          if [ -n "$(git status --porcelain -- data/history.json)" ]; then
            git config user.name "status-bot"
            git config user.email "status-bot@users.noreply.github.com"
            git add data/history.json
            git commit -m "chore: status changed"
            git push
          fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish to GitHub Pages
      id-token: write   # verify the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
